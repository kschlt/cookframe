<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cookframe S4 — Cooking UX hypotheses</title>
    <!--
      CFV1-S4 throwaway prototype. Plain HTML + CSS + vanilla JS, ONE file, no
      dependency manifest and no build step (proof: cooking-ux/plain-html-prototype).
      Deliberately unstyled beyond legibility — the spike warns that effort spent
      making it pretty is effort spent biasing the result.

      What it lets a real phone + a real recipe test (docs/cooking-ux.md §3, §11):
        - Hypothesis A (a separate NOW YOU NEED block) vs Hypothesis B (quantities
          inline in the action prose) — the SAME recipe, switched live.
        - assumedAtHand suppression of retrieval reminders in FETCH / PREPARE,
          reported on BOTH halves: what it removed, and a standing check that it
          never touched START NOW (measured/state prerequisites).
        - Cooking-unit granularity: the unit count is shown so the reader can judge
          wall-of-paragraph vs 15-20 micro-steps.
        - Split / reserved amounts rendered for salience (RESERVE / KEEP FOR LATER).

      Recipe content is real, held as FUNCTIONAL DATA ONLY (quantities, action
      verbs, splits, prerequisites, phases — facts/procedures, not creative prose)
      in the #recipe-data block below, each with its source URL. See README.md.
    -->
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #666;
        --line: #d8d8d8;
        --accent: #7a3b00;
        --reserve-bg: #fff4e5;
        --reserve-ink: #7a3b00;
        --suppressed: #9a9a9a;
        --bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ececec;
          --muted: #a0a0a0;
          --line: #3a3a3a;
          --accent: #ffb066;
          --reserve-bg: #2a1e0d;
          --reserve-ink: #ffcf9c;
          --suppressed: #6a6a6a;
          --bg: #141414;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 0 16px calc(48px + env(safe-area-inset-bottom, 0px));
      }
      header.controls {
        position: sticky;
        top: 0;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 10px 0;
        margin: 0 -16px 8px;
        padding-left: 16px;
        padding-right: 16px;
        z-index: 5;
      }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .row + .row { margin-top: 8px; }
      label.pick { font-size: 13px; color: var(--muted); }
      select, button.toggle {
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        min-height: 40px;
      }
      button.toggle[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .seg button { border: none; border-radius: 0; min-width: 128px; }
      .seg button + button { border-left: 1px solid var(--line); }
      .meta { font-size: 13px; color: var(--muted); margin: 4px 0 0; }

      h1.title { font-size: 22px; margin: 12px 0 2px; }
      .flow { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
      .flow b { color: var(--ink); }

      section.card {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        margin: 0 0 14px;
      }
      .kicker {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        margin: 0 0 6px;
      }
      .sub {
        font-size: 12px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
        margin: 12px 0 4px;
      }
      ul { margin: 0; padding-left: 20px; }
      li { margin: 2px 0; }
      li.suppressed { color: var(--suppressed); text-decoration: line-through; }
      .note { font-size: 13px; color: var(--muted); margin: 8px 0 0; font-style: italic; }

      .unit { border-top: 1px solid var(--line); padding: 14px 0; }
      .unit:first-of-type { border-top: none; }
      .unit-head { display: flex; gap: 8px; align-items: baseline; }
      .unit-n { font-weight: 700; color: var(--accent); }
      .unit-phase { font-size: 13px; color: var(--muted); }
      .need { background: var(--reserve-bg); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
      .need .kicker { margin-bottom: 4px; }
      .need .items { font-size: 16px; }
      .need .split { font-weight: 700; }
      .action { margin: 8px 0 0; }
      .reserve {
        background: var(--reserve-bg);
        color: var(--reserve-ink);
        border-radius: 8px;
        padding: 8px 10px;
        margin: 8px 0 0;
        font-weight: 600;
      }
      .critical { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
      .count { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
      .src { font-size: 12px; color: var(--muted); margin-top: 6px; word-break: break-all; }
    </style>
  </head>
  <body>
    <header class="controls">
      <div class="row">
        <label class="pick" for="recipe">Recipe</label>
        <select id="recipe"></select>
      </div>
      <div class="row">
        <div class="seg" role="group" aria-label="Layout hypothesis">
          <button class="toggle" id="hypA" aria-pressed="true">A · NOW YOU NEED</button>
          <button class="toggle" id="hypB" aria-pressed="false">B · inline</button>
        </div>
        <button class="toggle" id="suppress" aria-pressed="false">Hide at-hand basics</button>
      </div>
      <p class="meta" id="meta"></p>
    </header>

    <main id="app"></main>

    <script>
      "use strict"

      const DATA = JSON.parse(document.getElementById("recipe-data").textContent)
      const state = { recipe: 0, hyp: "A", suppress: false }

      const $ = (id) => document.getElementById(id)
      const el = (tag, cls, text) => {
        const n = document.createElement(tag)
        if (cls) n.className = cls
        if (text != null) n.textContent = text
        return n
      }

      function populateRecipePicker() {
        const sel = $("recipe")
        DATA.recipes.forEach((r, i) => {
          const o = el("option", null, r.title)
          o.value = String(i)
          sel.appendChild(o)
        })
        sel.value = String(state.recipe)
      }

      function renderBeforeYouStart(r) {
        const card = el("section", "card")
        card.appendChild(el("p", "kicker", "Before you start"))

        if (r.beforeYouStart.setUp && r.beforeYouStart.setUp.length) {
          card.appendChild(el("p", "sub", "Set up"))
          const ul = el("ul")
          for (const s of r.beforeYouStart.setUp) ul.appendChild(el("li", null, s))
          card.appendChild(ul)
        }

        if (r.beforeYouStart.startNow && r.beforeYouStart.startNow.length) {
          // START NOW is measured/state prerequisites — NEVER suppressed.
          card.appendChild(el("p", "sub", "Start now"))
          const ul = el("ul")
          for (const s of r.beforeYouStart.startNow) ul.appendChild(el("li", null, s))
          card.appendChild(ul)
        }

        if (r.beforeYouStart.fetchPrepare && r.beforeYouStart.fetchPrepare.length) {
          card.appendChild(el("p", "sub", "Fetch / prepare"))
          const ul = el("ul")
          let hidden = 0
          for (const f of r.beforeYouStart.fetchPrepare) {
            const suppressed = state.suppress && f.assumedAtHand === true
            const li = el("li", suppressed ? "suppressed" : null, f.item)
            ul.appendChild(li)
            if (suppressed) hidden++
          }
          card.appendChild(ul)
          if (state.suppress) {
            card.appendChild(
              el(
                "p",
                "note",
                hidden === 0
                  ? "Suppression on: nothing was at-hand to hide here."
                  : `Suppression on: ${hidden} at-hand basic(s) struck through. Check — is any real readiness step among them?`,
              ),
            )
          }
        }
        return card
      }

      function renderUnitA(u) {
        const box = el("div", "unit")
        const head = el("div", "unit-head")
        head.appendChild(el("span", "unit-n", `${u.n}`))
        if (u.phase) head.appendChild(el("span", "unit-phase", `— ${u.phase}`))
        box.appendChild(head)

        if (u.nowYouNeed && u.nowYouNeed.length) {
          const need = el("div", "need")
          need.appendChild(el("p", "kicker", "Now you need"))
          const items = el("p", "items")
          u.nowYouNeed.forEach((ing, i) => {
            if (i > 0) items.appendChild(document.createTextNode(" · "))
            const span = el("span", ing.split ? "split" : null, `${ing.qty} ${ing.item}`)
            items.appendChild(span)
          })
          need.appendChild(items)
          box.appendChild(need)
        }

        box.appendChild(el("p", "action", u.actionPlain))
        if (u.reserve) {
          const res = el("p", "reserve", `RESERVE — ${u.reserve}`)
          box.appendChild(res)
        }
        if (u.critical) box.appendChild(el("p", "critical", u.critical))
        return box
      }

      function renderUnitB(u) {
        const box = el("div", "unit")
        const head = el("div", "unit-head")
        head.appendChild(el("span", "unit-n", `${u.n}`))
        if (u.phase) head.appendChild(el("span", "unit-phase", `— ${u.phase}`))
        box.appendChild(head)

        box.appendChild(el("p", "action", u.actionInline))
        if (u.reserve) box.appendChild(el("p", "reserve", `Keep for later — ${u.reserve}`))
        if (u.critical) box.appendChild(el("p", "critical", u.critical))
        return box
      }

      function render() {
        const r = DATA.recipes[state.recipe]
        const app = $("app")
        app.textContent = ""

        app.appendChild(el("h1", "title", r.title))
        if (r.flow && r.flow.length) {
          const flow = el("p", "flow")
          flow.appendChild(document.createTextNode("FLOW  "))
          r.flow.forEach((p, i) => {
            if (i > 0) flow.appendChild(document.createTextNode(" → "))
            flow.appendChild(el("b", null, p))
          })
          app.appendChild(flow)
        }

        app.appendChild(renderBeforeYouStart(r))

        const units = el("section", "card")
        units.appendChild(el("p", "kicker", `Cooking — Hypothesis ${state.hyp}`))
        units.appendChild(el("p", "count", `${r.units.length} cooking units`))
        for (const u of r.units) {
          units.appendChild(state.hyp === "A" ? renderUnitA(u) : renderUnitB(u))
        }
        app.appendChild(units)

        const src = el("p", "src", `source (functional data only): ${r.sourceUrl}`)
        app.appendChild(src)

        $("meta").textContent =
          state.hyp === "A"
            ? "A: quantities in a NOW YOU NEED block, action prose without them."
            : "B: quantities woven into the action prose, no separate block."
      }

      $("recipe").addEventListener("change", (e) => {
        state.recipe = Number(e.target.value)
        render()
      })
      $("hypA").addEventListener("click", () => {
        state.hyp = "A"
        $("hypA").setAttribute("aria-pressed", "true")
        $("hypB").setAttribute("aria-pressed", "false")
        render()
      })
      $("hypB").addEventListener("click", () => {
        state.hyp = "B"
        $("hypB").setAttribute("aria-pressed", "true")
        $("hypA").setAttribute("aria-pressed", "false")
        render()
      })
      $("suppress").addEventListener("click", () => {
        state.suppress = !state.suppress
        $("suppress").setAttribute("aria-pressed", String(state.suppress))
        render()
      })

      populateRecipePicker()
      render()
    </script>
  </body>
</html>
