name: Deploy

# Deploys the maintainer's Fly instance when a GitHub Release is published
# (docs/deploy-fly.md, "Deploying from a release"). It is a separate file from
# `ci.yml` on purpose: `ci.yml` has no deploy step and no secret, and
# `slice0/no-deploy-from-fork-prs` keeps that true. This file never runs on a
# pull request, a fork or a push; only the owner of the repository publishes a
# release.
#
# Inert until `FLY_API_TOKEN` is set on the `production` environment: with no
# token the job fails at the first step and nothing is deployed.
on:
  release:
    types: [published]

permissions:
  contents: read

# One deploy at a time, and a second release waits instead of racing the first.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The environment's required reviewer is the gate: the job pauses until the
    # owner approves it, and only then can it read the token.
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      # `--remote-only` builds on Fly's builder, so this job only waits. The
      # release command in fly.toml (`npm run migrate`) runs before the new
      # version takes traffic, and a failure there fails this job and leaves the
      # running version in place. Tests are not repeated here: `main` is green
      # by branch protection before a release is cut from it.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
