name: CI

# Triggered on pushes to main and on pull requests. Deliberately uses
# `pull_request` (not `pull_request_target`): a fork PR runs with a read-only
# token and no access to repository secrets, and there is no deployment job in
# this workflow — so a fork PR cannot deploy or exfiltrate a secret (CFV1-SL0).
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only by default. No job here needs write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # `npm run check` is `biome check`, a strict superset of `biome lint` +
      # `biome format`: it also runs assist actions (organize-imports). Running
      # the narrower pair here left that rule enforced only inside the slow
      # `container` job, whose job is proving the image builds — so a push could
      # be green on `lint` and red on `container` for a lint reason. It cost a
      # CI cycle on this branch.
      - run: npm run check

  unit:
    runs-on: ubuntu-latest
    steps:
      # Full history so the append-only check below can read bars.json as it stood
      # at the PR's base commit (or the previous commit on a push to main).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # The Python the scorer's self-test runs under is PINNED. An unpinned
      # runtime turns a future interpreter change into a mystery failure on an
      # unrelated pull request — the scorer would start passing or failing for a
      # reason no diff explains.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:unit
      # The S1 scorer's discrimination proof. It is Python and lives under
      # `spikes/`, so no other job in this workflow would ever run it — and
      # `spikes/s1-photo-gate/VERDICT.md` names `--selftest` as one of the four
      # committed things that decide what the gate's rates mean. A proof the
      # gate never runs is a proof nobody is checking. A non-zero exit fails the
      # job (no continue-on-error), so a scorer whose self-test stops
      # discriminating breaks the build here.
      - run: python3 spikes/s1-capture-quality/score.py --selftest
      # CFV1-THR: the capture-quality bars are declared once in bars.json. Verify
      # the registry's integrity (no in-place edit), that THRESHOLD.md's tables
      # are still generated from it (a hand-edit fails here), and the six
      # declare-once/freeze proofs. Python under the same pinned interpreter; a
      # non-zero exit fails the build, so a bar edited to fit a result is caught.
      - run: python3 spikes/s1-capture-quality/thresholds.py verify
      - run: python3 spikes/s1-capture-quality/thresholds.py gen-doc --check
      - run: python3 spikes/s1-capture-quality/test_thresholds.py
      # A bar edited in place is refused against the committed baseline even if its
      # per-entry hash was re-forged (which the at-rest `verify` above cannot see):
      # every entry the base already carried must be unchanged, only appends added.
      - run: >-
          python3 spikes/s1-capture-quality/thresholds.py append-only-check
          --git-base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}"

  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:schema-contract
      - run: npm run eval

  normalization-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:normalization-invariant

  url-fetch-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:url-fetch-security

  model-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:model-egress

  # CFV1-DBQ's three deciding queries are proved against real PostgreSQL, not a
  # stand-in: ADR-0003's hypothesis names Postgres, and a shape comparison run on
  # a different engine would measure the engine. The tests skip when no server
  # answers, so this service is what stops "skipped everywhere" from passing —
  # `tests/unit/repo-config.test.ts` asserts that this job and this service exist.
  dbq:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:dbq

  # CFV1-PG. The durable store is PostgreSQL (ADR-0015), so its proofs run
  # against PostgreSQL — a stand-in would be measuring the stand-in. Unlike the
  # `dbq` job's suites, these do NOT skip when the server is missing: this job
  # sets DATABASE_URL, and `tests/persistence/postgres-harness.ts` fails rather
  # than skips once a database has been asked for. A skipped proof reports
  # success, and that has already cost this project a gate once.
  # `tests/unit/repo-config.test.ts` asserts this job, its service and its
  # DATABASE_URL exist, which is what stops "skipped everywhere" from passing.
  persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:persistence

  # CFV1-SL5's proofs run here rather than only inside `quality`. `quality` lives
  # in the `container` job, whose job is proving the image builds — a slice going
  # red there reads as a container failure, which cost a CI cycle once already
  # (see the `lint` job's comment). A named job is also what branch protection
  # can require by name.
  slice5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:slice5

  # `slice3` and `slice4` were declared as npm scripts and run by no job: their
  # tests reached CI only inside `quality`, in the `container` job. They were not
  # unrun, but a failure in either reported as a container failure, and a check
  # that cannot be named cannot be required by branch protection. Found by the
  # guard in `tests/unit/repo-config.test.ts` that every `test:` script is run by
  # a named job here — a guard added for `slice5` that turned out to have two
  # older gaps behind it.
  slice3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:slice3

  slice4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:slice4

  # `test:cooking-ux` arrived on `main` from CFV1-S4 while this branch was open,
  # with no job of its own — the third instance of the same gap, and the first
  # one caught on a MERGE rather than in a single branch. Neither side was wrong
  # alone: S4 added the script, this branch added the guard, and only the merge
  # result has both. That is precisely the case CFV1-BASE exists for.
  cooking-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:cooking-ux

  slice6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:slice6

  # CFV1-RUN. The unit that gave the instance a process and the library an
  # address. Its proofs spawn the declared start command and bind real sockets,
  # so they are slower than an in-process suite and belong in a job whose name
  # says what failed — the same reasoning that gave `slice3`/`slice4`/`slice5`
  # their own jobs.
  #
  # It needs PostgreSQL because since CFV1-PG the composition root builds the
  # durable store, so a process that starts at all is one that reached a
  # database. `tests/run/process.test.ts` skips its serving cases when
  # DATABASE_URL is absent — which is honest ONLY because this job sets it, and
  # `tests/unit/repo-config.test.ts` requires that this job does.
  run:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:run

  # CFV1-IDS. The guard that turns red when two branches claim one record number.
  # It gets a job of its own for the reason `ci/every-declared-test-script-runs-in-
  # a-named-job` states: this check earns its keep on the pull request that pulls
  # `main` and discovers the collision, and "container failed" is not a sentence
  # that tells the author to renumber their record.
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:records

  # CFV1-PROT. These proofs read documents and `.github/dependabot.yml`; they
  # reach no network and no platform API, deliberately — what a workflow token
  # can read of this repository's settings was measured and is nothing
  # (`docs/repository-protections.md`).
  protections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:protections

  slice1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:slice1

  # A finding here fails the build. gitleaks exits non-zero when it detects a
  # secret, and the step has no `continue-on-error`, so a leak blocks the PR.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SCANNER is pinned here, beside the other version pins, because
          # otherwise it is pinned in somebody else's repository. The action
          # resolves its binary as `process.env.GITLEAKS_VERSION || "8.24.3"`
          # (`src/index.js`), so without this line the day gitleaks-action
          # changes that literal is the day `secret-scan` scans with a different
          # tool, with nothing in this tree to show for it. That is the same
          # argument the `unit` job's `setup-python` step makes about an
          # unpinned interpreter, and the scanner is its peer. `8.24.3` is what
          # the action resolves today, so this pins the present rather than
          # changing it.
          #
          # NOT `latest`: the action treats that value as "resolve the newest
          # release at run time", which is an unpin wearing a pin's clothes.
          # `ci/secret-scan-pins-its-scanner` refuses it.
          GITLEAKS_VERSION: "8.24.3"

  # Actually builds the dev/CI container and runs the documented quality gate
  # inside it, so "the container builds and runs the documented commands" is
  # proven by execution rather than asserted from the Dockerfile text. This is
  # a build only — it never pushes the image anywhere.
  container:
    runs-on: ubuntu-latest
    # The runtime-image step below starts the real composition root, which since
    # CFV1-PG reads a database before it binds. The service is for that step
    # alone; the quality gate above it needs nothing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t cookframe:ci .
      - name: Run the quality gate inside the container
        run: docker run --rm cookframe:ci npm run quality

      # CFV1-RUN's runtime image. `tests/run/containment.test.ts` compares the
      # two Dockerfiles' commands, which is a reading of text and cannot show
      # that an image boots. This is the half that can: build the runtime image
      # and start the process inside it, against a real published port.
      - name: Build the runtime image
        run: docker build -f Dockerfile.runtime -t cookframe:runtime .

      - name: Start the process in the runtime image and talk to it
        run: |
          set -euo pipefail
          # Minted here rather than written down. A credential-shaped literal in
          # a public workflow file is one a scanner cannot tell from a real
          # secret, and these live for the length of this step.
          #
          # No pipeline into `head`/`grep -q` anywhere in this step: those exit
          # as soon as they have what they need, the writer upstream takes
          # SIGPIPE, and `pipefail` then fails a command that actually succeeded.
          # It happens to work while the data is small enough to be written in
          # one go, which is the worst kind of passing.
          ingest="run-ci-$(openssl rand -hex 16)"
          library="run-ci-$(openssl rand -hex 16)"

          # Applied with the command an operator is told to run (`.env.example`).
          # A schema built any other way here would be a schema nobody will ever
          # have. The GLOB is the point: a list of filenames is a list somebody
          # has to remember to extend, and `0002` arrived while this step named
          # only `0001`.
          for migration in migrations/*.sql; do
            psql "postgres://postgres:postgres@127.0.0.1:5432/postgres" \
              -v ON_ERROR_STOP=1 -f "$migration"
          done

          # The service is published on the RUNNER's loopback, and the container
          # has its own. `host.docker.internal` is how it reaches the host, and
          # the published port stays `-p` rather than `--network host` so this
          # step still proves the image serves on a port it publishes.
          #
          # PUBLIC_BASE_URL is required since CFV1-SHOP: capability URLs are
          # built on it, and an instance without one refuses to start by name.
          # It is the address this step reaches the container at.
          docker run -d --name cookframe-runtime -p 8080:8080 \
            --add-host=host.docker.internal:host-gateway \
            -e PORT=8080 \
            -e MODEL_PROVIDER=openai \
            -e OPENAI_API_KEY=not-a-real-key \
            -e OPENAI_MODEL=not-a-real-model \
            -e COOKFRAME_INGEST_CREDENTIAL="$ingest" \
            -e COOKFRAME_LIBRARY_CREDENTIAL="$library" \
            -e PUBLIC_BASE_URL=http://127.0.0.1:8080 \
            -e DATABASE_URL="postgres://postgres:postgres@host.docker.internal:5432/postgres" \
            cookframe:runtime
          for _ in $(seq 1 60); do
            logs="$(docker logs cookframe-runtime 2>&1 || true)"
            case "$logs" in *"cookframe listening on port"*) break ;; esac
            sleep 2
          done
          docker logs cookframe-runtime
          # Without the credential the library is the shared miss; with it, the
          # page. Both from a container whose only command is the process.
          missed="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
          served="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $library" http://127.0.0.1:8080/)"
          echo "no credential -> $missed; with credential -> $served"
          test "$missed" = "404"
          test "$served" = "200"
          # And it stops on the signal a container runtime sends — reaching the
          # process's own handler, not merely killing PID 1. `CMD ["npm",
          # "start"]` failed exactly here: every request above passed and the
          # shutdown never ran, because npm was PID 1 and the process that
          # installed the handler never saw SIGTERM.
          docker stop -t 20 cookframe-runtime
          logs="$(docker logs cookframe-runtime 2>&1 || true)"
          case "$logs" in
            *"cookframe stopping on SIGTERM"*) echo "shutdown handler ran" ;;
            *) echo "the process never ran its shutdown handler. Logs:"; echo "$logs"; exit 1 ;;
          esac

      - name: Remove the runtime container
        if: always()
        run: docker rm -f cookframe-runtime || true

  # CFV1-BASE. Every other job here measures this pull request's head against
  # the base it was BRANCHED from. Twice in one night that was not enough: two
  # pull requests, each green against its own base, produced a broken `main`
  # when both landed, and neither had a textual conflict for git to report.
  #
  # This job measures the MERGE RESULT, recomputed here against whatever the
  # base tip is now rather than read from a ref GitHub calculated when this pull
  # request was last pushed — a merge result computed once and trusted an hour
  # later has the same fault the job exists to close.
  #
  # It runs the repository's own `quality` script, read from `package.json`
  # rather than restated, so this adds no second definition of green. A
  # typecheck alone is known to be insufficient by measurement: the second
  # incident typechecks perfectly and dies in its tests.
  #
  # Cost, stated rather than left to be discovered: every merge now waits for a
  # second full gate run. On this repository that is a few minutes, against a
  # default branch that was red for an hour on the first incident and until a
  # repair pull request on the second.
  #
  # Skipped when the head already contains the base — the merge result is then
  # the head's own tree, which the other jobs have already measured.
  merge-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: the merge has to be computed, not looked up.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Fetched here, at run time, so the base is the live tip rather than the
      # one this pull request was opened against.
      - name: Fetch the current base tip
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
      - name: Run the declared gate against the merge result
        run: |
          npx tsx scripts/merge-gate.ts \
            --base=FETCH_HEAD \
            --head="${{ github.event.pull_request.head.sha }}" \
            --base-label="${{ github.event.pull_request.base.ref }} as it stands now" \
            --head-label="PR #${{ github.event.pull_request.number }}"
