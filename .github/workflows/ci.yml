name: CI

# Triggered on pushes to main and on pull requests. Deliberately uses
# `pull_request` (not `pull_request_target`): a fork PR runs with a read-only
# token and no access to repository secrets, and there is no deployment job in
# this workflow — so a fork PR cannot deploy or exfiltrate a secret (CFV1-SL0).
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only by default. No job here needs write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run check` is `biome check`, a strict superset of `biome lint` +
      # `biome format`: it also runs assist actions (organize-imports). Running
      # the narrower pair here left that rule enforced only inside the slow
      # `container` job, whose job is proving the image builds — so a push could
      # be green on `lint` and red on `container` for a lint reason. It cost a
      # CI cycle on this branch.
      - run: npm run check

  unit:
    runs-on: ubuntu-latest
    steps:
      # Full history so the append-only check below can read bars.json as it stood
      # at the PR's base commit (or the previous commit on a push to main).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Python the scorer's self-test runs under is PINNED. An unpinned
      # runtime turns a future interpreter change into a mystery failure on an
      # unrelated pull request — the scorer would start passing or failing for a
      # reason no diff explains.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:unit
      # The S1 scorer's discrimination proof. It is Python and lives under
      # `spikes/`, so no other job in this workflow would ever run it — and
      # `spikes/s1-photo-gate/VERDICT.md` names `--selftest` as one of the four
      # committed things that decide what the gate's rates mean. A proof the
      # gate never runs is a proof nobody is checking. A non-zero exit fails the
      # job (no continue-on-error), so a scorer whose self-test stops
      # discriminating breaks the build here.
      - run: python3 spikes/s1-capture-quality/score.py --selftest
      # CFV1-THR: the capture-quality bars are declared once in bars.json. Verify
      # the registry's integrity (no in-place edit), that THRESHOLD.md's tables
      # are still generated from it (a hand-edit fails here), and the six
      # declare-once/freeze proofs. Python under the same pinned interpreter; a
      # non-zero exit fails the build, so a bar edited to fit a result is caught.
      - run: python3 spikes/s1-capture-quality/thresholds.py verify
      - run: python3 spikes/s1-capture-quality/thresholds.py gen-doc --check
      - run: python3 spikes/s1-capture-quality/test_thresholds.py
      # A bar edited in place is refused against the committed baseline even if its
      # per-entry hash was re-forged (which the at-rest `verify` above cannot see):
      # every entry the base already carried must be unchanged, only appends added.
      - run: >-
          python3 spikes/s1-capture-quality/thresholds.py append-only-check
          --git-base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}"

  schema-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:schema-contract
      - run: npm run eval

  normalization-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:normalization-invariant

  url-fetch-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:url-fetch-security

  model-egress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:model-egress

  # CFV1-DBQ's three deciding queries are proved against real PostgreSQL, not a
  # stand-in: ADR-0003's hypothesis names Postgres, and a shape comparison run on
  # a different engine would measure the engine. The tests skip when no server
  # answers, so this service is what stops "skipped everywhere" from passing —
  # `tests/unit/repo-config.test.ts` asserts that this job and this service exist.
  dbq:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:dbq

  # CFV1-SL5's proofs run here rather than only inside `quality`. `quality` lives
  # in the `container` job, whose job is proving the image builds — a slice going
  # red there reads as a container failure, which cost a CI cycle once already
  # (see the `lint` job's comment). A named job is also what branch protection
  # can require by name.
  slice5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:slice5

  # `slice3` and `slice4` were declared as npm scripts and run by no job: their
  # tests reached CI only inside `quality`, in the `container` job. They were not
  # unrun, but a failure in either reported as a container failure, and a check
  # that cannot be named cannot be required by branch protection. Found by the
  # guard in `tests/unit/repo-config.test.ts` that every `test:` script is run by
  # a named job here — a guard added for `slice5` that turned out to have two
  # older gaps behind it.
  slice3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:slice3

  slice4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:slice4

  slice1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:slice1

  # A finding here fails the build. gitleaks exits non-zero when it detects a
  # secret, and the step has no `continue-on-error`, so a leak blocks the PR.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Actually builds the dev/CI container and runs the documented quality gate
  # inside it, so "the container builds and runs the documented commands" is
  # proven by execution rather than asserted from the Dockerfile text. This is
  # a build only — it never pushes the image anywhere.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t cookframe:ci .
      - name: Run the quality gate inside the container
        run: docker run --rm cookframe:ci npm run quality

  # CFV1-BASE. Every other job here measures this pull request's head against
  # the base it was BRANCHED from. Twice in one night that was not enough: two
  # pull requests, each green against its own base, produced a broken `main`
  # when both landed, and neither had a textual conflict for git to report.
  #
  # This job measures the MERGE RESULT, recomputed here against whatever the
  # base tip is now rather than read from a ref GitHub calculated when this pull
  # request was last pushed — a merge result computed once and trusted an hour
  # later has the same fault the job exists to close.
  #
  # It runs the repository's own `quality` script, read from `package.json`
  # rather than restated, so this adds no second definition of green. A
  # typecheck alone is known to be insufficient by measurement: the second
  # incident typechecks perfectly and dies in its tests.
  #
  # Cost, stated rather than left to be discovered: every merge now waits for a
  # second full gate run. On this repository that is a few minutes, against a
  # default branch that was red for an hour on the first incident and until a
  # repair pull request on the second.
  #
  # Skipped when the head already contains the base — the merge result is then
  # the head's own tree, which the other jobs have already measured.
  merge-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: the merge has to be computed, not looked up.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fetched here, at run time, so the base is the live tip rather than the
      # one this pull request was opened against.
      - name: Fetch the current base tip
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
      - name: Run the declared gate against the merge result
        run: |
          npx tsx scripts/merge-gate.ts \
            --base=FETCH_HEAD \
            --head="${{ github.event.pull_request.head.sha }}" \
            --base-label="${{ github.event.pull_request.base.ref }} as it stands now" \
            --head-label="PR #${{ github.event.pull_request.number }}"
